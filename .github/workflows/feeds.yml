name: feeds

on:
  schedule:
    - cron: "0 * * * *"
  # Only what changes the served bytes, the machinery producing them or its
  # tests, so a README edit does not spin up a runner to redeploy an identical
  # tree.
  push:
    branches: [main]
    paths:
      - data/**
      - public/index.html
      - public/og.png
      - scripts/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/feeds.yml
  workflow_dispatch:

# Least privilege by default; jobs widen this only where they need to.
permissions:
  contents: read

# A job GitHub never hands to a runner stays queued for up to 24 hours,
# holding the group and blocking every later run; timeout-minutes counts only
# once a job runs. Cancelling in progress lets the next run clear it. A healthy
# run it cuts off loses nothing: the next run publishes whatever the site
# lacks.
concurrency:
  group: feeds
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tags, only exact releases.
      - uses: astral-sh/setup-uv@v10.2.0

      # Anything feeds.py writes to the archive stays there, so a broken push
      # must not get to run against it.
      - name: Lint
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Check types
        run: uv run --locked ty check

      - name: Test
        run: uv run --locked pytest

      # Only the archive, public/index.html and public/og.png are committed;
      # the feeds in public/ are rendered from the archive on every run.
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so the push
      # trigger above cannot loop.
      - name: Update feeds
        run: |
          # feeds.py prints the commit message: a subject such as "Add 1 article,
          # 2 briefings", then one line per added or edited entry.
          message=$(uv run --locked scripts/feeds.py)
          # The archive is written deterministically, so it only differs when a
          # run learned something new.
          git add data
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git push

      # Republishing identical bytes would just pile up deployment records, so a
      # run publishes only when the site serves something other than what it
      # rendered: new entries, a rendering change, or a run cancelled before it
      # deployed. Rendering is deterministic, so an unchanged archive publishes
      # nothing; the site sits behind a cache of up to 10 minutes, so it
      # converges within a run or two rather than at once.
      - name: Compare with site
        id: compare
        run: |
          for f in public/*; do
            if ! curl -fsS "https://mlafeldt.github.io/theinfo-feeds/${f#public/}" | cmp -s - "$f"; then
              echo "$f differs from the site"
              echo "stale=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

      - id: upload
        if: steps.compare.outputs.stale == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: update
    if: needs.update.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
