name: feeds

on:
  schedule:
    - cron: "0 * * * *"
  # Only what changes the served bytes, the machinery producing them or its
  # tests, so a README edit does not spin up a runner to redeploy an identical
  # tree.
  push:
    branches: [main]
    paths:
      - data/**
      - public/index.html
      - public/og.png
      - scripts/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/feeds.yml
  workflow_dispatch:

# Least privilege by default; jobs widen this only where they need to.
permissions:
  contents: read

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tags, only exact releases.
      - uses: astral-sh/setup-uv@v10.2.0

      # Anything feeds.py writes to the archive stays there, so a broken push
      # must not get to run against it.
      - name: Lint
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Check types
        run: uv run --locked ty check

      - name: Test
        run: uv run --locked pytest

      # Only the archive, public/index.html and public/og.png are committed;
      # the feeds in public/ are rendered from the archive on every run.
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so the push
      # trigger above cannot loop.
      - name: Update feeds
        id: update
        run: |
          # feeds.py prints the commit message: a subject such as "Add 1 article,
          # 2 briefings", then one line per added or edited entry.
          message=$(uv run --locked scripts/feeds.py)
          # The archive is written deterministically, so it only differs when a
          # run learned something new.
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Republishing identical bytes every run would just pile up deployment
      # records, so scheduled runs publish only when the archive changed.
      - id: upload
        if: steps.update.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: update
    if: needs.update.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
